apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: ttplatform-auth-service
          image: table-tennis-platform-auth-service:latest
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
