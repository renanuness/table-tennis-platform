services:
  #---BACKEND---
  service-discovery:
    build:
      context: backend/infrastructure/service-discovery
    ports:
      - "48081:8081"
    networks:
      - tt-network

  api-gateway:
      build:
        context: backend/infrastructure/api-gateway
      depends_on:
        - service-discovery
      ports:
        - "48082:8082"
      networks:
        - tt-network

  auth-service:
    build:
      context: backend/services/auth-service
    environment:
        - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8081/eureka/
        - SPRING_APPLICATION_NAME=auth-service
        # Configuração do banco de dados
        - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/auth_db
        - SPRING_DATASOURCE_USERNAME=ttplatform
        - SPRING_DATASOURCE_PASSWORD=ttplatform123
        - SPRING_JPA_HIBERNATE_DDL_AUTO=update
        - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
        - service-discovery
    ports:
      - "48083:8083"
    networks:
      - tt-network

  matchmaking-service:
    build:
      context: backend/services/matchmaking-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8081/eureka/
      - SPRING_APPLICATION_NAME=matchmaking-service
      # Configuração do banco de dados
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-matchmaking:5431/matchmaking_db
      - SPRING_DATASOURCE_USERNAME=ttplatform
      - SPRING_DATASOURCE_PASSWORD=ttplatform123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - service-discovery
    ports:
      - "48084:8084"
    networks:
      - tt-network

  profile-service:
    build:
      context: backend/services/profile-service
    depends_on:
      - service-discovery
    ports:
      - "48085:8085"
    networks:
      - tt-network

  ranking-service:
    build:
      context: backend/services/ranking-service
    depends_on:
      - service-discovery
    ports:
      - "48086:8086"
    networks:
      - tt-network

  timeline-service:
    build:
      context: backend/services/timeline-service
    depends_on:
      - service-discovery
    ports:
      - "48087:8087"
    networks:
      - tt-network

  #---DATABASES---

  # PostgreSQL para Auth Service
  postgres-auth:
    image: postgres:16-alpine
    container_name: db-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ttplatform
      POSTGRES_PASSWORD: ttplatform123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5431:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./scripts/init-auth-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttplatform -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL para Matchmaking Service
  postgres-matchmaking:
    image: postgres:16-alpine
    container_name: db-matchmaking
    environment:
      POSTGRES_DB: matchmaking_db
      POSTGRES_USER: ttplatform
      POSTGRES_PASSWORD: ttplatform123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres-matchmaking-data:/var/lib/postgresql/data
      - ./scripts/init-matchmaking-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttplatform -d matchmaking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      #target: ${BUILD_TARGET:-development}
    container_name: ttplatform-web
    environment:
      VITE_API_URL: http://api-gateway:8082/api
    ports:
      - "80:80"
      - "443:443"
    networks:
      - tt-network
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules


networks:
  tt-network:
    driver: bridge

# ----- VOLUMES -----
volumes:
  postgres-auth-data:
    name: tt-postgres-auth-data
  postgres-matchmaking-data:
    name: tt-postgres-matchmaking-data