# ===== CONFIGURAÇÕES DO SERVIDOR =====
server.port=8085

# ===== CONFIGURAÇÕES DA APLICAÇÃO =====
spring.application.name=profile-service
spring.config.import=optional:configserver:

# ===== CONFIGURAÇÕES DO BANCO DE DADOS =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:profile_db}
spring.datasource.username=${DB_USER:ttplatform}
spring.datasource.password=${DB_PASSWORD:ttplatform123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== CONFIGURAÇÕES DO JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== CONFIGURAÇÕES DO EUREKA =====
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8081}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${spring.application.name}

# ===== CONFIGURAÇÕES RABBITMQ =====
spring.rabbitmq.host = rabbit1
spring.rabbitmq.port = 5672
spring.rabbitmq.username = rabbitmq
spring.rabbitmq.password = rabbitmq

# ===== CONFIGURAÇÕES DO ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
